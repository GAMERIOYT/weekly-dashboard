<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Calendar</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <style>
        :root {
            --bg-color: #070312;
            --sidebar-bg: rgba(12, 8, 32, 0.72);
            --text-color: #e8e4ff;
            --muted: #a39bc8;
            --primary-color: #7c5cff;
            --event-color: #3ecfff;
            --glass-border: rgba(180, 160, 255, 0.22);
            --glow: 0 0 24px rgba(124, 92, 255, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            overflow: hidden;
        }

        /* Background Effects */
        .cosmos {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(1200px 700px at 12% 18%, rgba(124, 92, 255, 0.35), transparent 55%),
                radial-gradient(900px 600px at 88% 8%, rgba(62, 207, 255, 0.22), transparent 50%),
                radial-gradient(800px 700px at 72% 92%, rgba(255, 80, 170, 0.18), transparent 52%),
                radial-gradient(circle at 50% 50%, #160a32 0%, #070312 68%);
        }

        .stars, .stars2, .stars3 {
            position: absolute;
            inset: 0;
            background-repeat: repeat;
        }

        .stars {
            background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent),
                              radial-gradient(1px 1px at 80px 120px, #fff, transparent),
                              radial-gradient(1.5px 1.5px at 160px 70px, #dce7ff, transparent),
                              radial-gradient(1px 1px at 240px 200px, #fff, transparent),
                              radial-gradient(1px 1px at 300px 40px, #c9b6ff, transparent);
            background-size: 340px 240px;
            animation: drift 80s linear infinite;
            opacity: 0.85;
        }

        .stars2 {
            background-image: radial-gradient(1.5px 1.5px at 50px 90px, #fff, transparent),
                              radial-gradient(2px 2px at 180px 40px, #9be7ff, transparent),
                              radial-gradient(1px 1px at 270px 160px, #fff, transparent);
            background-size: 420px 280px;
            animation: drift 140s linear infinite reverse;
            opacity: 0.6;
        }

        .stars3 {
            background-image: radial-gradient(2px 2px at 100px 20px, rgba(255,255,255,0.9), transparent),
                              radial-gradient(1px 1px at 220px 140px, rgba(255,210,255,0.8), transparent);
            background-size: 500px 360px;
            animation: twinkle 4s ease-in-out infinite alternate;
            opacity: 0.5;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: 340px 240px; }
        }

        @keyframes twinkle {
            from { opacity: 0.25; }
            to { opacity: 0.7; }
        }

        #sidebar,
        #calendar-container {
            position: relative;
            z-index: 1;
        }

        #sidebar {
            width: 330px;
            min-width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border-right: 1px solid var(--glass-border);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            box-shadow: 12px 0 40px rgba(0, 0, 0, 0.35);
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-bottom: 6px;
        }

        .brand span {
            font-size: 11px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #9be7ff;
        }

        h2 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            letter-spacing: 0.04em;
            background: linear-gradient(90deg, #fff, #c9b6ff 45%, #3ecfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 13px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #c9b6ff;
        }

        .control-group {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));
            border: 1px solid var(--glass-border);
            padding: 16px;
            border-radius: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--muted);
        }

        input[type="text"], input[type="datetime-local"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: rgba(7, 3, 18, 0.65);
            color: var(--text-color);
            outline: none;
            font-family: inherit;
        }

        input[type="text"]:focus, input[type="datetime-local"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.25);
        }

        /* Color Picker fix */
        input[type="color"] {
            width: 100%;
            height: 38px;
            margin-bottom: 10px;
            padding: 3px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: rgba(7, 3, 18, 0.65);
            cursor: pointer;
        }

        button {
            background: linear-gradient(135deg, var(--primary-color), #3ecfff);
            color: #0b0418;
            border: none;
            padding: 11px;
            width: 100%;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-family: inherit;
            letter-spacing: 0.02em;
            box-shadow: var(--glow);
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--muted);
            color: var(--text-color);
            box-shadow: none;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #external-events {
            margin-top: 6px;
        }

        .fc-event {
            background: linear-gradient(135deg, var(--event-color), #7c5cff) !important;
            color: #07101c !important;
            padding: 9px;
            margin-bottom: 8px;
            border-radius: 10px !important;
            cursor: grab;
            text-align: center;
            border: none !important;
            font-weight: 600;
            box-shadow: 0 0 16px rgba(62, 207, 255, 0.28);
        }

        .hint {
            font-size: 12px;
            color: var(--muted);
            margin: 10px 0 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hint label {
            display: inline;
            margin: 0;
            font-weight: 400;
            color: var(--muted);
        }

        #enable-notif-btn {
            background: linear-gradient(135deg, #ff5fb1, #ffb347);
            box-shadow: 0 0 20px rgba(255, 95, 177, 0.35);
        }

        #calendar-container {
            flex-grow: 1;
            padding: 22px;
            overflow: hidden;
            min-width: 0;
        }

        #calendar {
            background: rgba(10, 6, 28, 0.62);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 18px;
            border-radius: 22px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.08);
            height: 100%;
        }

        /* CUSTOM MODAL STYLES */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--sidebar-bg);
            width: 400px;
            max-width: 90%;
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
            transform: translateY(20px);
            transition: transform 0.2s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .time-inputs {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .time-inputs > div {
            flex: 1;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* FullCalendar Overrides */
        .fc {
            --fc-page-bg-color: transparent;
            --fc-neutral-bg-color: rgba(255,255,255,0.04);
            --fc-border-color: rgba(180, 160, 255, 0.16);
            --fc-today-bg-color: rgba(124, 92, 255, 0.16);
            --fc-now-indicator-color: #ff5fb1;
            --fc-page-text-color: var(--text-color);
            --fc-neutral-text-color: var(--muted);
            --fc-small-font-size: 0.85em;
        }

        .fc, .fc table, .fc th, .fc td, .fc a {
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
        }

        .fc-theme-standard .fc-scrollgrid,
        .fc-theme-standard td,
        .fc-theme-standard th {
            border-color: rgba(180, 160, 255, 0.16);
        }

        .fc .fc-col-header-cell-cushion,
        .fc .fc-timegrid-slot-label-cushion,
        .fc .fc-toolbar-title {
            color: #f3efff;
        }

        .fc .fc-toolbar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
        }

        .fc .fc-button-primary {
            background: rgba(124, 92, 255, 0.22) !important;
            border: 1px solid rgba(180, 160, 255, 0.35) !important;
            color: #f3efff !important;
            text-transform: capitalize;
            box-shadow: none !important;
            border-radius: 10px !important;
        }

        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:hover {
            background: linear-gradient(135deg, var(--primary-color), #3ecfff) !important;
            color: #0b0418 !important;
            border-color: transparent !important;
        }

        .fc .fc-timegrid-col.fc-day-today,
        .fc .fc-daygrid-day.fc-day-today {
            background: rgba(124, 92, 255, 0.12);
        }

        .fc-event .fc-event-main {
            color: #07101c;
            font-weight: 600;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(180, 160, 255, 0.35);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="cosmos" aria-hidden="true">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <!-- CUSTOM EVENT MODAL -->
    <div id="event-modal" class="modal-overlay">
        <div class="modal-content control-group">
            <h3>Create New Event</h3>
            <label for="event-title-input">Event Title</label>
            <input type="text" id="event-title-input" placeholder="e.g., Team Sync, Deep Work" autocomplete="off">
            
            <div class="time-inputs">
                <div>
                    <label for="event-start-input">Start</label>
                    <input type="datetime-local" id="event-start-input">
                </div>
                <div>
                    <label for="event-end-input">End</label>
                    <input type="datetime-local" id="event-end-input">
                </div>
            </div>
            
            <div class="modal-actions">
                <button id="save-event-btn">Save Event</button>
                <button id="cancel-event-btn" class="secondary">Cancel</button>
            </div>
        </div>
    </div>

    <div id="sidebar">
        <div class="brand">
            <span>Mission control</span>
            <h2>Nebula Calendar</h2>
        </div>
        
        <div class="control-group">
            <h3>Create Draggable Block</h3>
            <label for="block-title">Event Title</label>
            <input type="text" id="block-title" placeholder="e.g., Orbit sync, Deep work">
            <button id="add-block-btn">Add to Draggables</button>
        </div>

        <div class="control-group">
            <h3>Drag into Calendar</h3>
            <div id="external-events">
                <div class="fc-event" data-title="Lunch Break">Lunch Break</div>
                <div class="fc-event" data-title="Deep Work">Deep Work</div>
                <div class="fc-event" data-title="Review">Review</div>
            </div>
            <p class="hint">
                <input type="checkbox" id="drop-remove">
                <label for="drop-remove">Remove after drop</label>
            </p>
        </div>

        <div class="control-group">
            <h3>Customization</h3>
            <label for="theme-primary">Primary Color</label>
            <input type="color" id="theme-primary" value="#7c5cff">
            
            <label for="theme-bg">Background Color</label>
            <input type="color" id="theme-bg" value="#070312">

            <label for="theme-event">Default Event Color</label>
            <input type="color" id="theme-event" value="#3ecfff">
        </div>

        <div class="control-group">
            <h3>Notifications</h3>
            <button id="enable-notif-btn">Enable Notifications</button>
            <p class="hint">You will be notified 1 minute before an event starts.</p>
        </div>
    </div>

    <div id="calendar-container">
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const root = document.documentElement;
            
            // Theme Pickers
            document.getElementById('theme-primary').addEventListener('input', (e) => {
                root.style.setProperty('--primary-color', e.target.value);
            });
            document.getElementById('theme-bg').addEventListener('input', (e) => {
                root.style.setProperty('--bg-color', e.target.value);
                document.body.style.background = e.target.value;
            });
            document.getElementById('theme-event').addEventListener('input', (e) => {
                root.style.setProperty('--event-color', e.target.value);
                document.querySelectorAll('#external-events .fc-event').forEach(el => {
                    el.style.background = e.target.value;
                });
            });

            // Draggables
            const containerEl = document.getElementById('external-events');
            const checkbox = document.getElementById('drop-remove');

            let Draggable = FullCalendar.Draggable;
            new Draggable(containerEl, {
                itemSelector: '.fc-event',
                eventData: function(eventEl) {
                    return {
                        title: eventEl.innerText,
                        backgroundColor: document.getElementById('theme-event').value,
                        borderColor: document.getElementById('theme-event').value
                    };
                }
            });

            document.getElementById('add-block-btn').addEventListener('click', () => {
                const title = document.getElementById('block-title').value.trim();
                if (title) {
                    const el = document.createElement('div');
                    el.className = 'fc-event';
                    el.innerText = title;
                    el.style.background = document.getElementById('theme-event').value;
                    containerEl.appendChild(el);
                    document.getElementById('block-title').value = '';
                }
            });

            // Helper to format dates for the datetime-local input
            function formatForInput(dateObj) {
                // Adjusts for local timezone cleanly
                const d = new Date(dateObj.getTime() - (dateObj.getTimezoneOffset() * 60000));
                return d.toISOString().slice(0, 16);
            }

            // Modal Elements
            const modal = document.getElementById('event-modal');
            const titleInput = document.getElementById('event-title-input');
            const startInput = document.getElementById('event-start-input');
            const endInput = document.getElementById('event-end-input');
            const saveBtn = document.getElementById('save-event-btn');
            const cancelBtn = document.getElementById('cancel-event-btn');

            let currentSelectionInfo = null; // Stores calendar selection data

            function closeModal() {
                modal.classList.remove('active');
                titleInput.value = '';
                calendar.unselect();
            }

            cancelBtn.addEventListener('click', closeModal);

            saveBtn.addEventListener('click', () => {
                const title = titleInput.value.trim();
                if (title && currentSelectionInfo) {
                    calendar.addEvent({
                        title: title,
                        start: startInput.value,
                        end: endInput.value,
                        allDay: currentSelectionInfo.allDay,
                        backgroundColor: document.getElementById('theme-event').value
                    });
                    closeModal();
                } else if (!title) {
                    titleInput.focus(); // prompt user to enter title
                }
            });

            // Close modal if clicking on the background overlay
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });


            // Initialize FullCalendar
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                initialView: 'timeGridWeek',
                editable: true,
                droppable: true,
                selectable: true,
                nowIndicator: true,
                drop: function(info) {
                    if (checkbox.checked) {
                        info.draggedEl.parentNode.removeChild(info.draggedEl);
                    }
                },
                select: function(info) {
                    // Save info to use later when they click "Save"
                    currentSelectionInfo = info;
                    
                    // Pre-fill the start and end times in the modal
                    startInput.value = formatForInput(info.start);
                    
                    // If they just click a time without dragging, FullCalendar sometimes omits end time
                    if (info.end) {
                        endInput.value = formatForInput(info.end);
                    } else {
                        // Default to 1 hour later if no end time
                        const end = new Date(info.start);
                        end.setHours(end.getHours() + 1);
                        endInput.value = formatForInput(end);
                    }

                    // Open the modal
                    modal.classList.add('active');
                    setTimeout(() => titleInput.focus(), 100); 
                },
                eventClick: function(info) {
                    if (confirm(`Do you want to delete the event '${info.event.title}'?`)) {
                        info.event.remove();
                    }
                }
            });
            
            calendar.render();

            // Notifications logic...
            let notificationsEnabled = false;

            document.getElementById('enable-notif-btn').addEventListener('click', () => {
                if (!("Notification" in window)) {
                    alert("This browser does not support desktop notification");
                } else if (Notification.permission === "granted") {
                    notificationsEnabled = true;
                    alert("Notifications are already enabled!");
                } else if (Notification.permission !== "denied") {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            notificationsEnabled = true;
                            new Notification("Nebula Calendar", { body: "Notifications successfully enabled!" });
                        }
                    });
                }
            });

            setInterval(() => {
                if (!notificationsEnabled) return;

                const now = new Date();
                const events = calendar.getEvents();

                events.forEach(event => {
                    if (event.start) {
                        const timeDiff = event.start.getTime() - now.getTime();
                        if (timeDiff > 0 && timeDiff <= 60000) {
                            new Notification("Event Reminder", {
                                body: `Your event "${event.title}" is starting in 1 minute!`
                            });
                        }
                    }
                });
            }, 60000);
        });
    </script>
</body>
</html>
